server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API requests to Spring Boot backend
    location /api/ {
        # The trailing slash strips the /api/ prefix before forwarding.
        # Example: /api/users/samuel/list-todos -> /users/samuel/list-todos
        proxy_pass http://52.66.223.6:8082/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
