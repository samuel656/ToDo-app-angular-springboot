<h1>My ToDo's</h1>
<div *ngIf="deleteMsg" class="alert alert-success">{{deleteMsg}}</div>
<div class="container">
    <table class="table">
       
        <thead>
            <tr>
                <th>Id</th>
                <th>Description</th>
                <th>Target Date</th>
                <th>Is Completed?</th>
                <th>Actions</th>
                
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let todo of todos">
                <td>{{todo.id}}</td>
                <td>{{todo.description}}</td>
                <td>{{todo.target | date }}</td>
                <td>{{todo.done}}</td>
                <td><button (click)="updateTodo(todo.id)" class="btn btn-success">Update</button></td>
                <td><button (click)="deleteTodo(todo.id)" class="btn btn-warning">Delete</button></td>
            
            </tr>
        </tbody>
    </table>
    <div class="row">
        <button class="btn btn-success" (click)="createTodo()">Add new Todo</button>
    </div>
</div>
